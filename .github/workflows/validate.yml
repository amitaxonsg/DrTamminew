name: Validate clinic website

on:
  push:
    branches: [main, feature/chatgpt-redesign]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate sitemap XML
        run: php -r '$x=simplexml_load_file("sitemap.xml"); if($x===false){exit(1);} echo "sitemap.xml valid\n";'

      - name: Check required files
        run: |
          test -f index.php
          test -f includes/bootstrap.php
          test -f includes/header.php
          test -f includes/footer.php
          test -f assets/css/site.css
          test -f assets/js/site.js
          test -f contact/index.php
          test -f contact/submit.php
          test -f robots.txt
          test -f sitemap.xml
